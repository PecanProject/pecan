# ILAMB configuration for scoring PEcAn SDA reanalysis against
# observational benchmarks. GSoC 2026, PEcAn Project.
#
# Benchmark periods chosen to overlap the PEcAn reanalysis (2012-2024):
#  - Biomass: XuSaatchi2021 (2000-2019). PEcAn cVeg is above-ground wood
#    carbon; XuSaatchi is live biomass carbon. Scope difference (roots)
#    flagged for review. No scale_factor (matches ILAMB standard config).
#  - LAI: GIMMS_LAI4g (1982-2020). Direct lai comparison.
#  - Soil carbon: HWSD2 (time-invariant). PEcAn TotSoilCarb is 0-200cm vs
#    benchmark shallower; PEcAn reads higher. Flagged for review.

[h1: Ecosystem and Carbon Cycle]
bgcolor = "#ECFFE6"

[h2: Biomass]
variable       = "biomass"
alternate_vars = "cVeg"
weight         = 5
skip_rmse      = True
mass_weighting = True

[XuSaatchi2021]
source     = "DATA/biomass/XuSaatchi2021/XuSaatchi.nc"
weight     = 20
table_unit = "Pg"
plot_unit  = "kg m-2"
space_mean = False

[h2: Leaf Area Index]
variable       = "lai"
cmap           = "Greens"
weight         = 3
mass_weighting = True

[GIMMS_LAI4g]
source        = "DATA/lai/GIMMS_LAI4g/cao2023_lai.nc"
weight        = 15
skip_cycle    = True
skip_rmse     = True

[h2: Soil Carbon]
variable       = "cSoil"
weight         = 5
mass_weighting = True

[HWSD2]
source     = "DATA/cSoil/HWSD2/cSoil.nc"
weight     = 15
table_unit = "Pg"
plot_unit  = "kg m-2"
space_mean = False
skip_rmse  = True
