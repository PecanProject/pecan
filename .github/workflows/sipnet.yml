name: sipnet

on:
  workflow_call:
    inputs:
      R-version:
        required: true
        type: string
      sipnet-version:
        description: SIPNET release tag to download and test against
        required: false
        type: string
        default: v1.3.0

env:
  R_LIBS_USER: /usr/local/lib/R/site-library
  LC_ALL: en_US.UTF-8
  NCPUS: 2
  PGHOST: postgres
  CI: true

jobs:
  sipnet:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    services:
      postgres:
        image: mdillon/postgis:9.5
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    container: 
      image: pecan/depends:develop-R${{ inputs.R-version }}

    steps:
    # checkout source code
    - name: work around https://github.com/actions/checkout/issues/766
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/checkout@v6
      with:
        set-safe-directory: false

    # install additional tools needed
    - name: install utils
      run: apt-get update && apt-get install -y postgresql-client qpdf
    - name: install new dependencies
      run: Rscript scripts/generate_dependencies.R && cd docker/depends && Rscript pecan.depends.R

    # initialize database
    - name: db setup
      uses: docker://pecan/db:ci
    - name: add models to db
      run: ./scripts/add.models.sh

    # install sipnet
    # v1.x releases ship the bare binary, v2.x ships a tarball containing `sipnet`
    - name: Download SIPNET for Linux
      env:
        SIPNET_VERSION: ${{ inputs.sipnet-version }}
      run: |
        base="https://github.com/PecanProject/sipnet/releases/download/${SIPNET_VERSION}"
        case "${SIPNET_VERSION}" in
          v1.*)
            curl -fL -o sipnet-linux "${base}/sipnet-linux-${SIPNET_VERSION}"
            ;;
          *)
            curl -fL -o sipnet.tar.gz "${base}/sipnet-linux-x86_64-${SIPNET_VERSION}.tar.gz"
            tar -xzf sipnet.tar.gz sipnet
            mv sipnet sipnet-linux
            ;;
        esac
        chmod +x sipnet-linux

    # compile PEcAn code
    - name: build
      run: make -j1

    # run SIPNET test
    - name: copy met file into working directory
      run: Rscript -e 'file.copy(system.file("niwot.clim", package = "PEcAn.SIPNET"), "niwot.clim")'
    - name: integration test
      run: ./tests/integration.sh ghaction
