name: Docker GHA

env:
  DEFAULT_R_VERSION: 4.4

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      r_version:
        description: 'R version to use'
        required: true
        type: choice
        default: "$DEFAULT_R_VERSION"
        options:
          - 4.2
          - 4.3
          - 4.4
          - 4.5
          - devel
  schedule:
    # 1:30 AM UTC, different R version each day
    - cron: '30 1 * * 1' # Rdevel
    - cron: '30 1 * * 2' # R4.2
    - cron: '30 1 * * 3' # R4.3
    - cron: '30 1 * * 4' # R4.4
    - cron: '30 1 * * 5' # R4.5

jobs:
  # ----------------------------------------------------------------------
  # Set R version.
  # ... (unchanged) ...
  # ----------------------------------------------------------------------
  rversion:
    runs-on: ubuntu-latest
    steps:
      - id: mon
        if: github.event.schedule == '30 1 * * 1'
        run: echo "R_VERSION=devel" >> "$GITHUB_OUTPUT"
      - id: tue
        if: github.event.schedule == '30 1 * * 2'
        run: echo "R_VERSION=4.2" >> "$GITHUB_OUTPUT"
      - id: wed
        if: github.event.schedule == '30 1 * * 3'
        run: echo "R_VERSION=4.3" >> "$GITHUB_OUTPUT"
      - id: thu
        if: github.event.schedule == '30 1 * * 4'
        run: echo "R_VERSION=4.4" >> "$GITHUB_OUTPUT"
      - id: fri
        if: github.event.schedule == '30 1 * * 5'
        run: echo "R_VERSION=4.5" >> "$GITHUB_OUTPUT"
      - id: default
        if: github.event_name != 'schedule'
        run: echo "R_VERSION=${{ github.event.inputs.r_version || env.DEFAULT_R_VERSION }}" >> "$GITHUB_OUTPUT"
    outputs:
      R_VERSION: ${{ join(steps.*.outputs.R_VERSION, '') }}

  # ----------------------------------------------------------------------
  # Helper to determine if we should push images (true for internal/main repo, false for external fork PRs)
  # ----------------------------------------------------------------------
  determine_push:
    runs-on: ubuntu-latest
    outputs:
      should_push:
        value: ${{ steps.push_check.outputs.should_push }}
    steps:
      - id: push_check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------
  # depends image has all the dependencies installed
  # ----------------------------------------------------------------------
  depends:
    permissions:
      packages: write
    needs: [rversion, determine_push]
    uses: ./.github/workflows/docker-build-image.yml
    with:
      image-name: depends
      build-context: docker/depends
      dockerfile: docker/depends/Dockerfile
      r-version: ${{ needs.rversion.outputs.R_VERSION }}
      platforms: "linux/amd64"
      enable-push: ${{ needs.determine_push.outputs.should_push == 'true' }} # Pass decision
    secrets: inherit
    id: depends_build # Give the job an ID to access its outputs
    outputs: # Expose the image tag
      image-primary-tag: ${{ fromJson(steps.depends_build.outputs.image-primary-tag) }}


  # ----------------------------------------------------------------------
  # base image has PEcAn compiled and installed, and depends on depends
  # ----------------------------------------------------------------------
  base:
    needs: [rversion, depends, determine_push]
    runs-on: ubuntu-latest # Each job needs a runner, even if just for download/load
    steps:
      # NEW: If not pushing, download and load the parent image (depends)
      - name: Download depends image artifact
        if: ${{ needs.determine_push.outputs.should_push == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: image-depends
          path: . # Download to current directory on the runner

      - name: Load depends image
        if: ${{ needs.determine_push.outputs.should_push == 'false' }}
        run: docker load -i depends.tar

      # Call the reusable workflow
      - uses: ./.github/workflows/docker-build-image.yml
        id: base_build # Give the workflow call an ID
        with:
          image-name: base
          build-context: .
          dockerfile: docker/base/Dockerfile
          r-version: ${{ needs.rversion.outputs.R_VERSION }}
          parent-image: "depends" # Short name for reference
          parent-image-full-tag: ${{ needs.depends.outputs.image-primary-tag }} # Pass the full tag
          platforms: "linux/amd64"
          enable-push: ${{ needs.determine_push.outputs.should_push == 'true' }}
        secrets: inherit
    outputs: # Expose the image tag
      image-primary-tag: ${{ fromJson(steps.base_build.outputs.image-primary-tag) }}

# ----------------------------------------------------------------------
# models image has some python installed to run models, depends on base
# ----------------------------------------------------------------------
  models:
    needs: [rversion, base, determine_push]
    runs-on: ubuntu-latest
    steps:
      - name: Download base image artifact
        if: ${{ needs.determine_push.outputs.should_push == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: image-base
          path: .

      - name: Load base image
        if: ${{ needs.determine_push.outputs.should_push == 'false' }}
        run: docker load -i base.tar

      - uses: ./.github/workflows/docker-build-image.yml
        id: models_build
        with:
          image-name: models
          build-context: docker/models
          dockerfile: docker/models/Dockerfile
          r-version: ${{ needs.rversion.outputs.R_VERSION }}
          parent-image: "base"
          parent-image-full-tag: ${{ needs.base.outputs.image-primary-tag }}
          enable-push: ${{ needs.determine_push.outputs.should_push == 'true' }}
        secrets: inherit
    outputs:
      image-primary-tag: ${{ fromJson(steps.models_build.outputs.image-primary-tag) }}

# ----------------------------------------------------------------------
# Next are images that have models installed
# ----------------------------------------------------------------------
  modelsbinary:
    needs: [rversion, models, determine_push]
    strategy:
      fail-fast: false
      matrix:
        name:
          - basgra
          - biocro
          - ed2_git
          - maespa
          - sipnet
        include:
          - name: basgra
            CONTEXT: models/basgra
            DOCKERFILE: models/basgra/Dockerfile
            PLATFORM: "linux/amd64"
            MODEL: basgra
            VERSION: BASGRA_N_v1
          - name: biocro
            CONTEXT: models/biocro
            DOCKERFILE: models/biocro/Dockerfile
            PLATFORM: "linux/amd64"
            MODEL: biocro
            VERSION: "0.95"
          - name: ed2_git
            CONTEXT: models/ed
            DOCKERFILE: models/ed/Dockerfile
            PLATFORM: "linux/amd64"
            MODEL: ed2
            VERSION: "git"
          - name: maespa
            CONTEXT: models/maespa
            DOCKERFILE: models/maespa/Dockerfile
            PLATFORM: "linux/amd64"
            MODEL: maespa
            VERSION: "git"
          - name: sipnet
            CONTEXT: models/sipnet
            DOCKERFILE: models/sipnet/Dockerfile
            PLATFORM: "linux/amd64"
            MODEL: sipnet
            VERSION: "git"
    runs-on: ubuntu-latest
    steps:
      - name: Download models image artifact
        if: ${{ needs.determine_push.outputs.should_push == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: image-models
          path: .

      - name: Load models image
        if: ${{ needs.determine_push.outputs.should_push == 'false' }}
        run: docker load -i models.tar

      - uses: ./.github/workflows/docker-build-image.yml
        id: modelsbinary_build
        with:
          image-name: model-${{ matrix.MODEL }}-${{ matrix.VERSION }}
          build-context: ${{ matrix.CONTEXT }}
          dockerfile: ${{ matrix.DOCKERFILE }}
          r-version: ${{ needs.rversion.outputs.R_VERSION }}
          parent-image: "models"
          parent-image-full-tag: ${{ needs.models.outputs.image-primary-tag }}
          model-version: ${{ matrix.VERSION }}
          platforms: ${{ matrix.PLATFORM }}
          enable-push: ${{ needs.determine_push.outputs.should_push == 'true' }}
        secrets: inherit
    outputs:
      image-primary-tag: ${{ fromJson(steps.modelsbinary_build.outputs.image-primary-tag) }}

# ----------------------------------------------------------------------
# Next are images that depend on base image
# ----------------------------------------------------------------------
  baseplus:
    needs: [rversion, base, determine_push]
    strategy:
      fail-fast: false
      matrix:
        name:
          - docs
          - executor
          - api
        include:
          - name: docs
            CONTEXT: .
            DOCKERFILE: docker/docs/Dockerfile
            PLATFORM: "linux/amd64"
          - name: executor
            CONTEXT: docker/executor
            DOCKERFILE: docker/executor/Dockerfile
            PLATFORM: "linux/amd64"
          - name: api
            CONTEXT: apps/api
            DOCKERFILE: apps/api/Dockerfile
            PLATFORM: "linux/amd64"
    runs-on: ubuntu-latest
    steps:
      - name: Download base image artifact
        if: ${{ needs.determine_push.outputs.should_push == 'false' }}
        uses: actions/download-artifact@v4
        with:
          name: image-base
          path: .

      - name: Load base image
        if: ${{ needs.determine_push.outputs.should_push == 'false' }}
        run: docker load -i base.tar

      - uses: ./.github/workflows/docker-build-image.yml
        id: baseplus_build
        with:
          image-name: ${{ matrix.name }}
          build-context: ${{ matrix.CONTEXT }}
          dockerfile: ${{ matrix.DOCKERFILE }}
          r-version: ${{ needs.rversion.outputs.R_VERSION }}
          parent-image: "base"
          parent-image-full-tag: ${{ needs.base.outputs.image-primary-tag }}
          platforms: ${{ matrix.PLATFORM }}
          enable-push: ${{ needs.determine_push.outputs.should_push == 'true' }}
        secrets: inherit
    outputs:
      image-primary-tag: ${{ fromJson(steps.baseplus_build.outputs.image-primary-tag) }}

  # ----------------------------------------------------------------------
  # Next are images that do not depend on either depends or base image
  # ----------------------------------------------------------------------
  extras:
    needs: [rversion, determine_push]
    strategy:
      fail-fast: false
      matrix:
        name:
          - web
          - shiny-dbsync
          - data
          - monitor
          - rstudio-nginx
        include:
          - name: web
            CONTEXT: .
            DOCKERFILE: docker/web/Dockerfile
            PLATFORM: "linux/amd64,linux/arm64"
          - name: shiny-dbsync
            CONTEXT: .
            DOCKERFILE: shiny/dbsync/Dockerfile
            PLATFORM: "linux/amd64"
          - name: data
            CONTEXT: docker/data
            DOCKERFILE: docker/data/Dockerfile
            PLATFORM: "linux/amd64,linux/arm64"
          - name: monitor
            CONTEXT: docker/monitor
            DOCKERFILE: docker/monitor/Dockerfile
            PLATFORM: "linux/amd64,linux/arm64"
          - name: rstudio-nginx
            CONTEXT: docker/rstudio-nginx
            DOCKERFILE: docker/rstudio-nginx/Dockerfile
            PLATFORM: "linux/amd64,linux/arm64"
    uses: ./.github/workflows/docker-build-image.yml
    id: extras_build
    with:
      image-name: ${{ matrix.name }}
      build-context: ${{ matrix.CONTEXT }}
      dockerfile: ${{ matrix.DOCKERFILE }}
      platforms: ${{ matrix.PLATFORM }}
      r-version: ${{ needs.rversion.outputs.R_VERSION }}
      enable-push: ${{ needs.determine_push.outputs.should_push == 'true' }}
    secrets: inherit