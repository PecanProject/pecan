        with:
          context: models/biocro
          file: models/biocro/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_biocro.outputs.tags }}
          labels: ${{ steps.meta_biocro.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Meta ed2_git
        id: meta_ed2_git
