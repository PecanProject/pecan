      - name: Meta rstudio-nginx
        id: meta_rstudio_nginx
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/rstudio-nginx
            ghcr.io/${{ github.repository_owner }}/rstudio-nginx
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build rstudio-nginx
        uses: docker/build-push-action@v6
        with:
          context: docker/rstudio-nginx
