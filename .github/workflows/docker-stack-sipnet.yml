        with:
          images: |
            pecan/ed2_git
            ghcr.io/${{ github.repository_owner }}/ed2_git
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build ed2_git
        uses: docker/build-push-action@v6
        with:
          context: models/ed2_git
          file: models/ed2_git/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_ed2_git.outputs.tags }}
          labels: ${{ steps.meta_ed2_git.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Meta maespa
        id: meta_maespa
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/maespa
            ghcr.io/${{ github.repository_owner }}/maespa
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build maespa
        uses: docker/build-push-action@v6
        with:
          context: models/maespa
          file: models/maespa/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_maespa.outputs.tags }}
          labels: ${{ steps.meta_maespa.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Meta sipnet
        id: meta_sipnet
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/sipnet
            ghcr.io/${{ github.repository_owner }}/sipnet
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build sipnet
        uses: docker/build-push-action@v6
        with:
          context: models/sipnet
          file: models/sipnet/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_sipnet.outputs.tags }}
          labels: ${{ steps.meta_sipnet.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===================== baseplus ===================
      - name: Meta docs
        id: meta_docs
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/docs
            ghcr.io/${{ github.repository_owner }}/docs
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build docs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/docs/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_docs.outputs.tags }}
          labels: ${{ steps.meta_docs.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Meta executor
        id: meta_executor
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/executor
            ghcr.io/${{ github.repository_owner }}/executor
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build executor
        uses: docker/build-push-action@v6
        with:
          context: docker/executor
          file: docker/executor/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_executor.outputs.tags }}
          labels: ${{ steps.meta_executor.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Meta api
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/api
            ghcr.io/${{ github.repository_owner }}/api
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build api
        uses: docker/build-push-action@v6
        with:
            context: apps/api
            file: apps/api/Dockerfile
            platforms: linux/amd64
            push: ${{ env.PUSH == 'true' }}
            tags: ${{ steps.meta_api.outputs.tags }}
            labels: ${{ steps.meta_api.outputs.labels }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

      # ===================== extras =====================
      - name: Meta web
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/web
            ghcr.io/${{ github.repository_owner }}/web
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Meta shiny-dbsync
        id: meta_shiny_dbsync
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/shiny-dbsync
            ghcr.io/${{ github.repository_owner }}/shiny-dbsync
