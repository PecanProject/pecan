name: Docker GHA

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*.*.*"
  pull_request:
  schedule:
    - cron: '30 4 * * 4'
  workflow_dispatch:

jobs:
  depends:
    name: depends / build
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      # common tag patterns (applied per image)
      TAG_PATTERNS: |
        type=ref,event=branch
        type=ref,event=pr
        type=sha
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------
      # (Optional) show effective push mode
      - name: Mode
        run: echo "PUSH = $PUSH"

      # -------------------------------------------------
      # Logins only when pushing
      - name: Login DockerHub
        if: ${{ env.PUSH == 'true' && secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login GHCR
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Helper note:
      # For images that are multi-arch (amd64,arm64) we only build both when pushing.
      # On PR (no push) we restrict to amd64 to avoid multi-platform export errors.

      # ===================== depends ====================
      - name: Meta depends
        id: meta_depends
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/depends
            ghcr.io/${{ github.repository_owner }}/depends
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build depends
        uses: docker/build-push-action@v6
        with:
          context: docker/depends
          file: docker/depends/Dockerfile
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_depends.outputs.tags }}
          labels: ${{ steps.meta_depends.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===================== base =======================
      - name: Meta base
        id: meta_base
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/base
            ghcr.io/${{ github.repository_owner }}/base
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build base
        uses: docker/build-push-action@v6
        with:
          context: docker/base
          file: docker/base/Dockerfile
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_base.outputs.tags }}
          labels: ${{ steps.meta_base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===================== models (meta image) ========
      - name: Meta models
        id: meta_models
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/models
            ghcr.io/${{ github.repository_owner }}/models
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build models
        uses: docker/build-push-action@v6
        with:
          context: docker/models
          file: docker/models/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_models.outputs.tags }}
          labels: ${{ steps.meta_models.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ===================== model binaries =============
      - name: Meta basgra
        id: meta_basgra
        uses: docker/metadata-action@v5
        with:
          images: |
            pecan/basgra
            ghcr.io/${{ github.repository_owner }}/basgra
          tags: ${{ env.TAG_PATTERNS }}
      - name: Build basgra
        uses: docker/build-push-action@v6
        with:
          context: models/basgra
          file: models/basgra/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta_basgra.outputs.tags }}
          labels: ${{ steps.meta_basgra.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Meta biocro
        id: meta_biocro
        uses: docker/metadata-action@v5
