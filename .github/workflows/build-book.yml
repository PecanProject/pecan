name: Build Book

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build book and upload artifact
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.R/library
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/*.r', '**/*.R', '**/DESCRIPTION') }}

      - name: Install required R packages
        run: |
          Rscript -e "install.packages(c('bookdown','knitr','rmarkdown','yaml'), repos='https://cloud.r-project.org')"

      - name: Render book
        run: |
          Rscript -e "bookdown::render_book('book_source/index.Rmd')"

      - name: Remove _main.Rmd if present
        run: |
          if [ -f book_source/_main.Rmd ]; then
            rm book_source/_main.Rmd
            echo "Removed book_source/_main.Rmd"
          else
            echo "book_source/_main.Rmd not found"
          fi

      - name: Upload generated book as artifact
        uses: actions/upload-artifact@v3
        with:
          name: pecan-book
          path: _book

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
