# Auto-apply labels to PRs based on changed files
# Triggered by .github/workflows/prlabeler.yml

# Documentation
'Documentation/User':
  - changed-files:
      - any-glob-to-any-file: 'book_source/**'
      - any-glob-to-any-file: 'documentation/user_guides/**'

'Documentation/Developer':
  - changed-files:
      - any-glob-to-any-file: 'CONTRIBUTING.md'
      - any-glob-to-any-file: 'DEBUGGING.md'
      - any-glob-to-any-file: 'DEV-INTRO.md'

'Documentation/General':
  - changed-files:
      - any-glob-to-any-file: 'README.md'
      - any-glob-to-any-file: 'documentation/**'

# Models
'Models/Climate':
  - changed-files:
      - any-glob-to-any-file: 'models/climate/**'

'Models/Biophysical':
  - changed-files:
      - any-glob-to-any-file: 'models/biophysical/**'

'Models/Economics':
  - changed-files:
      - any-glob-to-any-file: 'models/economics/**'

# Modules
'Modules':
  - changed-files:
      - any-glob-to-any-file: 'modules/**'

# Scripts
'Scripts/R':
  - changed-files:
      - any-glob-to-any-file: '**/*.R'
      - any-glob-to-any-file: '**/*.Rmd'

'Scripts/Python':
  - changed-files:
      - any-glob-to-any-file: '**/*.py'

'Scripts/Bash':
  - changed-files:
      - any-glob-to-any-file: '**/*.sh'

# Tests
'Tests':
  - all:
      - changed-files:
          - any-glob-to-any-file: ['tests/**', '**/tests/**']
          - any-glob-to-any-file: '!**/tests/Rcheck_reference.log'

# Docker
'Docker':
  - changed-files:
      - any-glob-to-any-file: 'docker/**'

# Web Frontend
'Web Frontend':
  - changed-files:
      - any-glob-to-any-file: 'web/**'

# Base
'Base':
  - changed-files:
      - any-glob-to-any-file: 'base/**'

# GitHub Actions (CI/CD)
'CI/CD':
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**'
